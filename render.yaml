services:
  - type: web
    name: campusconnect-api
    runtime: docker
    plan: free
    region: singapore
    branch: migration/supabase-postgres-v2
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://campus-connect-umber-eight.vercel.app,http://localhost:5173
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_FACULTY_PASSWORD
        sync: false
      - key: DEMO_STUDENT_PASSWORD
        sync: false
