spring.application.name=campusconnect-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=campus
spring.datasource.password=campus

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=CampusConnectTier1DevelopmentSecretKeyChangeBeforeProduction123456789
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
