spring.application.name=campusconnect-backend
server.port=${PORT:8080}

# Set SPRING_DATASOURCE_URL to the Supabase Session Pooler JDBC URL (port 5432) with sslmode=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.vercel.app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
