spring.application.name=campusconnect-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campus}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.vercel.app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
